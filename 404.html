<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function() {
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8e6e2">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#252525">
<title>404 — b347.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://b347.dev">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @font-face {
    font-family: 'IoskeleyMono';
    src: url('Fonts/IoskeleyMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IoskeleyMono';
    src: url('Fonts/IoskeleyMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg:       #f0eeea;
    --bg2:      #e8e6e2;
    --bg3:      #dddbd7;
    --border:   #b8b5b0;
    --text:     #1a1a1a;
    --muted:    #6b6762;
    --accent:   #916800;
    --dot-color:#b0ada8;
    --mono:     'IoskeleyMono', 'Courier New', Courier, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg:       #1c1c1c;
      --bg2:      #252525;
      --bg3:      #2e2e2e;
      --border:   #3a3a3a;
      --text:     #d8d4cc;
      --muted:    #7a7670;
      --accent:   #e8b84b;
      --dot-color:#3a3836;
    }
  }

  [data-theme="dark"] {
    --bg:       #1c1c1c;
    --bg2:      #252525;
    --bg3:      #2e2e2e;
    --border:   #3a3a3a;
    --text:     #d8d4cc;
    --muted:    #7a7670;
    --accent:   #e8b84b;
    --dot-color:#3a3836;
  }

  [data-theme="light"] {
    --bg:       #f0eeea;
    --bg2:      #e8e6e2;
    --bg3:      #dddbd7;
    --border:   #b8b5b0;
    --text:     #1a1a1a;
    --muted:    #6b6762;
    --accent:   #916800;
    --dot-color:#b0ada8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; scrollbar-gutter: stable; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-weight: 400;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    max-width: 980px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .colorbar {
    height: 6px;
    background: linear-gradient(to right,
      #e85454 0% 8%, #e88a3a 8% 16%, #e8b84b 16% 24%,
      #8bc34a 24% 32%, #4caf8a 32% 40%, #4a9ee8 40% 48%,
      #7c6ce8 48% 56%, #c84ae8 56% 64%, #e84a8a 64% 72%,
      #888 72% 80%, #555 80% 88%, #333 88% 100%
    );
  }

  .dot-rule {
    height: 8px;
    background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .site-header {
    border-bottom: 1px solid var(--border);
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
  }

  .site-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .site-title span { color: var(--accent); }

  .site-nav {
    border-bottom: 2px solid var(--border);
    display: flex;
    background: var(--bg2);
  }

  .site-nav a {
    display: block;
    padding: 6px 16px;
    font-size: 0.875rem;
    color: var(--text);
    border-right: 1px solid var(--border);
    text-decoration: none;
    font-family: var(--mono);
  }

  .site-nav a:hover { background: var(--bg3); color: var(--accent); }

  .page-body {
    flex: 1;
    padding: 48px 24px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .error-code {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .error-msg {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .error-body {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.7;
  }

  .back-link {
    display: inline-block;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 7px 14px;
    font-family: var(--mono);
    font-size: 0.875rem;
    text-decoration: none;
  }

  .back-link:hover {
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
  }

  .footer-dot-rule {
    height: 6px;
    background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
    background-size: 4px 4px;
    border-bottom: 1px solid var(--border);
  }

  .site-footer {
    border-top: 2px solid var(--border);
    background: var(--bg2);
  }

  .footer-inner {
    padding: 7px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-left {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .footer-code {
    font-size: 0.72rem;
    font-weight: 700;
    border: 1px solid var(--border);
    padding: 2px 7px;
    letter-spacing: 0.08em;
    background: var(--bg3);
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="colorbar"></div>

<header class="site-header">
  <div class="site-title">b<span>347</span>.dev</div>
</header>

<nav class="site-nav">
  <a href="/">Overview</a>
  <a href="/#apps">Apps</a>
  <a href="https://github.com/Bravosierra0" target="_blank" rel="noopener">GitHub ↗</a>
</nav>

<main class="page-body" id="main">
  <div class="error-code">HTTP 404</div>
  <p class="error-msg">Page not found.</p>
  <p class="error-body">The page you are looking for does not exist or has been moved.<br>Nothing to see here — but the rest of the site is intact.</p>
  <a href="/" class="back-link">← back to b347.dev</a>
</main>

<footer class="site-footer">
  <div class="footer-dot-rule"></div>
  <div class="footer-inner">
    <span class="footer-left">b347.dev — Computer-System-Engineering, Development</span>
    <span class="footer-code">404</span>
  </div>
</footer>

</body>
</html>
