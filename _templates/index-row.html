<!-- One app row for index.html, inside <div class="apps">. Status: live / testflight. Store link: [ App Store ], [ TestFlight ] or <span class="store muted">[ beta full ]</span>. -->
      <div class="app" id="{{SLUG}}">
        <div class="app-id"><img src="/{{SLUG}}/images/icon.png" alt=""><span><span class="app-name">{{NAME}}</span><span class="app-tag"> · {{TAGLINE}}</span></span></div>
        <div class="links"><span class="status live">● live</span><a class="store" href="{{STORE_URL}}">[ App Store ]</a><a href="/{{SLUG}}/support.html">[ support ]</a><a href="/{{SLUG}}/privacy.html">[ privacy ]</a></div>
      </div>
