<!-- Two snippets for index.html when adding an app. Replace the placeholders. -->

<!-- 1. App table row: inside <tbody> of the app table. -->
<tr>
  <td><span class="{{STATUS_CLASS}}">{{STATUS}}</span></td>
  <td class="app-name-cell"><a href="{{SLUG}}.html" aria-label="{{NAME}} app page"><img class="app-icon-sm" src="{{SLUG}}/images/icon.png" width="24" height="24" alt="">{{NAME}}</a></td>
  <td>{{TAGLINE}}</td>
  <td class="platform-tag">{{PLATFORMS}}</td>
</tr>

<!-- 2. Sidebar "App Store" block. TestFlight version: -->
<div class="kv-row"><span class="kv-key">{{NAME}}</span><span class="kv-val" style="color:var(--muted)">TestFlight</span></div>
<!-- Live version: -->
<div class="kv-row"><span class="kv-key">{{NAME}}</span><span class="kv-val"><a href="{{STORE_URL}}" aria-label="{{NAME}} on App Store">↗</a></span></div>
